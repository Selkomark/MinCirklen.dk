name: IaC plan

# Read-only — runs on every PR touching IaC/** so a plan is visible in review
# before anything is ever applied. Does not, and must not, run apply.
on:
  pull_request:
    paths:
      - "IaC/**"
      - ".github/workflows/iac-plan.yml"

permissions:
  contents: read
  id-token: write # for google-github-actions/auth's Workload Identity Federation
  pull-requests: write # to post the plan as a PR comment

concurrency:
  group: iac-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: IaC/environments/prod

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive ../../

      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('IaC/environments/prod/plan_output.txt', 'utf8').slice(-60000)
            const body = `#### Terraform plan — \`prod\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
