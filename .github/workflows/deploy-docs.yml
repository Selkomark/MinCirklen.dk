name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        working-directory: web-app
        run: bun install --frozen-lockfile
      - name: Build docs site
        working-directory: web-app
        run: bun run build:docs
      - name: SPA fallback for direct page links
        # GitHub Pages has no server-side routing, so a hard load of e.g. /pages/privacy-policy
        # 404s unless 404.html itself boots the app — it then reads location.pathname client-side
        # and renders the matching public page (see matchPublicPage() in src/App.tsx).
        run: cp web-app/dist-docs/index.html web-app/dist-docs/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web-app/dist-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
