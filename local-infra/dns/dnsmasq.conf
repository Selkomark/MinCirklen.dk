# Local DNS for dev-mincirklen.dk — self-contained to this repo, run via
# the `dns` service in the root docker-compose.yml. Doesn't touch, read,
# or depend on any other project's DNS config.
address=/dev-mincirklen.dk/127.0.0.1
address=/dev-mincirklen.dk/::1

# Don't use the host's /etc/resolv.conf to avoid loops
no-resolv
